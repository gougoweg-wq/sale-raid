<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Скидочный рейд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: витрина «дропа». Сверху дуэль (ты против бота), в центре карточка товара, снизу ввод. Тёмная тема магазина. */
:root{
  --bg:#0d0e14; --panel:#171a24; --panel2:#1f2331; --line:#2b3044; --fg:#f4f5fa; --muted:#9aa1b8;
  --tag:#ffd23f; --sale:#ff3d5a; --cyan:#3ddcff; --ok:#38e08a; --bot:#ff8a3d;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 20% -10%,#2a1530,transparent 50%),radial-gradient(ellipse at 90% 0%,#10304a,transparent 45%),var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.wrap{max-width:960px;margin:0 auto;padding-block:14px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{font:900 22px/1 var(--f-display);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;background:var(--sale);color:#fff;border-radius:8px;padding:4px 8px;transform:rotate(-4deg);display:inline-block}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:700 14px var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
.pill b{color:var(--tag)}
.ibtn{font:800 15px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:40px;min-width:40px;padding:0 10px;cursor:pointer}
.ibtn[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.lv{font:800 13px var(--f-body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:38px;cursor:pointer}
.lv[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.lv .w{color:var(--ok)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side .who{display:flex;justify-content:space-between;font:800 13px var(--f-body);color:var(--muted)}
.side .who b{font:900 18px var(--f-display);color:var(--fg)}
.bar{height:12px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0}
.me .bar i{background:linear-gradient(90deg,#3ddcff,#38e08a)}
.bot .bar i{background:linear-gradient(90deg,#ff8a3d,#ff3d5a)}
.bot .bar.rush i{box-shadow:0 0 12px #ff3d5a}
.vs{font:900 16px var(--f-display);color:var(--sale)}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:780px){.game{grid-template-columns:1fr}.duel{grid-template-columns:1fr;text-align:left}.vs{display:none}}
.product{position:relative;background:linear-gradient(160deg,#1d2130,#151824);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:280px;overflow:hidden}
.product .em{font-size:84px;line-height:1;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));animation:drop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.7);opacity:0}}
.product .name{font:800 20px var(--f-body)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price .old{font:700 30px var(--f-mono);font-variant-numeric:tabular-nums}
.price .old.strike{text-decoration:line-through;color:var(--muted);font-size:22px}
.badge{position:absolute;right:16px;top:16px;font:900 22px var(--f-display);background:var(--sale);color:#fff;border-radius:14px;padding:10px 12px;transform:rotate(8deg);box-shadow:0 8px 0 #8f1427}
.badge.up{background:var(--cyan);color:#06222b;box-shadow:0 8px 0 #0f6d84}
.q{font:800 21px/1.35 var(--f-body);margin:0}
.q .hl{color:var(--tag)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp div{background:var(--panel2);border-radius:12px;padding:10px;font:700 15px var(--f-body)}
.cmp b{font:700 18px var(--f-mono);display:block}
.side2{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.screen{font:700 40px/64px var(--f-mono);text-align:right;background:#0a0b10;border:2px solid var(--line);border-radius:14px;padding:0 16px;min-height:68px;color:var(--tag);font-variant-numeric:tabular-nums}
.screen.empty{color:#3a4058}
.screen.bad{border-color:var(--sale);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{font:700 24px var(--f-mono);min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer}
.key:active,.key.press{background:#2a3044;transform:translateY(2px)}
.key.go{background:var(--tag);color:#1a1300;border-color:var(--tag);font:900 15px var(--f-display)}
.key.del{color:var(--muted)}
.msg{min-height:26px;font:800 17px var(--f-body)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--sale)}
.hint{background:#1c2a3a;border:1px solid #2c4c6b;border-radius:12px;padding:10px 12px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:800 15px var(--f-body);background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer}
.btn.main{background:var(--tag);color:#1a1300;border-color:var(--tag)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.stash{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.stash h2,.side2 h2{font:800 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.items{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;font-size:28px}
.items span{background:var(--panel2);border-radius:10px;padding:2px 6px;animation:drop .4s}
.items span.lost{opacity:.3;filter:grayscale(1)}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,6,10,.75);backdrop-filter:blur(6px)}
.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;animation:drop .4s}
.modal h3{font:900 26px/1.15 var(--f-display);margin:0}
.modal p{margin:0;color:var(--muted)}
.modal .big{font-size:60px;line-height:1}
details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:800;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line)}
th{color:var(--muted);font-size:12px;border-top:0}
.st-ok{color:var(--ok)}.st-mid{color:var(--tag)}.st-bad{color:var(--sale)}
.how{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div class="logo"><i>−%</i>Скидочный рейд</div>
    <div class="hud">
      <div class="pill">Сэкономил: <b id="saved">0 ₪</b></div>
      <div class="pill">Серия: <b id="streakP">0</b></div>
      <button class="ibtn" id="timerBtn" type="button" aria-pressed="true" title="Бот-перекупщик с таймером">⏱ Бот</button>
      <button class="ibtn" id="mute" type="button" aria-label="Выключить звук">🔊</button>
    </div>
  </header>
  <nav class="levels" id="levels" aria-label="Уровни"></nav>

  <section class="duel" aria-label="Дуэль">
    <div class="side me"><div class="who"><span>Ты</span><b id="meScore">0</b></div><div class="bar"><i id="meBar"></i></div></div>
    <div class="vs">VS</div>
    <div class="side bot"><div class="who"><span>Бот-перекупщик</span><b id="botScore">0</b></div><div class="bar" id="botBarBox"><i id="botBar"></i></div></div>
  </section>

  <div class="game">
    <section class="product" id="product" aria-live="polite"></section>
    <section class="side2">
      <h2 id="lvTitle">Раунд</h2>
      <div class="screen empty" id="screen">₪ ?</div>
      <div class="msg" id="msg"></div>
      <div class="hint" id="hint" hidden></div>
      <div class="pad" id="pad"></div>
      <div class="row"><button class="btn" id="hintBtn" type="button">Подсказка</button></div>
      <p class="how">Печатай с клавиатуры, Enter — купить.</p>
    </section>
  </div>

  <section class="stash"><h2>Твой склад</h2><div class="items" id="items"></div></section>
  <details><summary>Для учителя: как решал</summary><div id="report"></div></details>
</div>

<div class="overlay" id="start"><div class="modal">
  <div class="big" aria-hidden="true">🛍️</div>
  <h3>Скидочный рейд</h3>
  <p>Бот-перекупщик тоже охотится за скидками. Посчитай цену быстрее него, и товар твой. 5 уровней, в конце Чёрная пятница.</p>
  <button class="btn main" id="playBtn" type="button">Погнали</button>
</div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const GOODS=[['👟','Кроссовки'],['🎧','Наушники'],['🎮','Геймпад'],['📱','Телефон'],['⌚','Смарт-часы'],['🛹','Скейт'],['🧥','Худи'],['🕹️','Приставка'],['🎒','Рюкзак'],['⚽','Мяч'],['🧢','Кепка'],['💻','Ноутбук'],['🚲','Велосипед'],['📷','Камера']];

// каждый генератор даёт целый ответ
const GEN={
 quick(){const t=pick([()=>{const p=R(2,40)*10;return [10,p]},()=>{const p=R(2,60)*2;return [50,p]},()=>{const p=R(2,30)*4;return [25,p]},()=>{const p=R(2,40)*5;return [20,p]}])();const [pc,p]=t;
   return {kind:'Быстрые %',p,pc,text:`Сколько это <span class="hl">${pc}%</span> от ${p} ₪?`,plain:pc+'% от '+p,a:p*pc/100,hint:pc===10?'10% — раздели на 10.':pc===50?'50% — это половина.':pc===25?'25% — это четверть: раздели на 4.':'20% — это два раза по 10%.'}},
 any(){const [pc,p]=pick([[15,R(2,20)*20],[5,R(2,30)*20],[30,R(2,20)*10],[1,R(2,9)*100],[7,R(2,9)*100],[35,R(2,10)*20],[12,R(2,8)*50]]);
   return {kind:'Любой %',p,pc,text:`Сколько это <span class="hl">${pc}%</span> от ${p} ₪?`,plain:pc+'% от '+p,a:p*pc/100,hint:'Найди 10% (раздели на 10) и 1% (раздели на 100), а из них собери '+pc+'%.'}},
 sale(){const pc=pick([10,20,25,30,40,15,50]);const step=pc===25?4:pc===15?20:10;const p=R(3,40)*step*(pc===15?1:1);const pp=pc===15?R(2,15)*20:p;
   return {kind:'Цена со скидкой',p:pp,pc,badge:'−'+pc+'%',text:`Скидка <span class="hl">${pc}%</span>. Сколько платить?`,plain:'цена '+pp+', скидка '+pc+'%',a:pp-pp*pc/100,hint:'Сначала найди '+pc+'% от '+pp+', потом вычти из цены.'}},
 mix(){if(Math.random()<.5){const pc=pick([10,20,5,25]);const step=pc===25?4:pc===5?20:10;const p=R(3,30)*step;return {kind:'Подорожание и сравнение',p,pc,badge:'+'+pc+'%',up:true,text:`Цена выросла на <span class="hl">${pc}%</span>. Сколько стоит теперь?`,plain:'цена '+p+', +'+pc+'%',a:p+p*pc/100,hint:'Найди '+pc+'% от '+p+' и прибавь к цене.'}}
   const a1=R(10,30)*10,d1=pick([10,20,30]),a2=a1-R(1,4)*10,d2=pick([10,20]);const f1=a1-a1*d1/100,f2=a2-a2*d2/100;if(f1===f2)return GEN.mix();
   return {kind:'Подорожание и сравнение',p:null,cmp:[[a1,d1,f1],[a2,d2,f2]],text:'Где дешевле? Введи <span class="hl">меньшую цену</span> после скидки.',plain:'сравнение '+a1+'−'+d1+'% и '+a2+'−'+d2+'%',a:Math.min(f1,f2),hint:'Посчитай обе цены со скидкой и выбери меньшую.'}},
 boss(){return pick([GEN.any,GEN.sale,GEN.sale,GEN.mix])()}
};
const LEVELS=[{name:'Быстрые %',gen:'quick',n:6,t:12},{name:'Любой %',gen:'any',n:6,t:16},{name:'Скидки',gen:'sale',n:6,t:18},{name:'Наценка и сравнение',gen:'mix',n:5,t:24},{name:'Чёрная пятница',gen:'boss',n:8,t:15}];

let lv=0,round=0,task=null,input='',busy=false,me=0,bot=0,streak=0,saved=0,timerOn=true,t0=0,tLeft=0,penalty=0,raf=0,hintShown=false,cur=null,good=null;
const log=LEVELS.map(()=>[]);

// звук
let ac=null,muted=false;function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
addEventListener('pointerdown',audio);addEventListener('keydown',audio);
function tone(f,d,type='square',v=.06,delay=0){if(!ac||muted)return;const t=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
const sWin=()=>{tone(784,.08);tone(1047,.1,'square',.06,.07);tone(1568,.18,'triangle',.08,.14)};
const sLose=()=>{tone(300,.15,'sawtooth',.06);tone(200,.25,'sawtooth',.06,.12)};
const sBad=()=>tone(150,.18,'sawtooth',.07);
const sTick=()=>tone(1200,.03,'square',.03);
const sFan=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.08,i*.09));

// частицы
const fx=$('fx'),ctx=fx.getContext('2d');let parts=[],on=false;
function size(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}
function burst(x,y,n=40){const C=['#ffd23f','#ff3d5a','#3ddcff','#38e08a','#fff'];for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,r:3+Math.random()*4,c:C[i%5],rot:Math.random()*6})}if(!on)loop()}
function loop(){on=true;const d=devicePixelRatio;ctx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.l-=.017;p.rot+=.2;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x*d,p.y*d);ctx.rotate(p.rot);ctx.fillRect(-p.r*d/2,-p.r*d/4,p.r*d,p.r*d/2);ctx.restore()});ctx.globalAlpha=1;if(parts.length)requestAnimationFrame(loop);else on=false}

function drawLevels(){const nav=$('levels');nav.replaceChildren();LEVELS.forEach((L,i)=>{const b=el('button','lv',(i+1)+'. '+L.name);b.type='button';b.setAttribute('aria-current',String(i===lv));const l=log[i];if(l.length>=L.n){const w=l.filter(x=>x.won).length;b.append(el('span','w',' '+w+'/'+L.n))}b.onclick=()=>go(i);nav.append(b)})}
function drawProduct(){const P=$('product');P.replaceChildren();P.append(el('div','em',good[0]),el('div','name',good[1]));
  if(task.badge){const b=el('div','badge'+(task.up?' up':''),task.badge);P.append(b)}
  if(task.cmp){const c=el('div','cmp');task.cmp.forEach(([a,d],i)=>{const x=el('div');x.append(el('span',null,(i?'Магазин Б':'Магазин А')+' · −'+d+'%'));x.append(el('b',null,a+' ₪'));c.append(x)});P.append(c)}
  else{const pr=el('div','price');pr.append(el('span','old'+(task.badge&&!task.up?'':''),task.p+' ₪'));P.append(pr)}
  const q=el('p','q');q.innerHTML=task.text;P.append(q)}
function newRound(){good=pick(GOODS);task=GEN[LEVELS[lv].gen]();input='';hintShown=false;penalty=0;cur={kind:task.kind,q:task.plain,a:task.a,won:false,first:true,hint:false,ms:0};
  drawProduct();drawScreen();$('msg').textContent='';$('msg').className='msg';$('hint').hidden=true;$('hint').textContent=task.hint;$('hintBtn').disabled=false;
  $('lvTitle').textContent=LEVELS[lv].name+' · раунд '+(round+1)+' из '+LEVELS[lv].n;
  $('meBar').style.width='0%';startTimer()}
function startTimer(){cancelAnimationFrame(raf);const T=LEVELS[lv].t*1000;t0=performance.now();$('botBar').style.width='0%';$('botBarBox').classList.remove('rush');let lastTick=0;
  if(!timerOn){$('botBar').style.width='0%';return}
  const step=t=>{const k=Math.min(1,(t-t0+penalty)/T);$('botBar').style.width=(k*100)+'%';if(k>.75){$('botBarBox').classList.add('rush');if(t-lastTick>500){sTick();lastTick=t}}
    if(k>=1){botWins();return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function drawScreen(){const s=$('screen');s.textContent=input?input+' ₪':'₪ ?';s.classList.toggle('empty',!input);$('meBar').style.width=Math.min(100,input.length*25)+'%'}
function press(k){if(busy)return;if(k==='del')input=input.slice(0,-1);else if(k==='go'){submit();return}else if(input.length<6)input=(input==='0'?'':input)+k;drawScreen()}
function submit(){if(!input||busy)return;const v=+input;
  if(v===task.a){busy=true;cancelAnimationFrame(raf);cur.won=true;cur.ms=performance.now()-t0;me++;streak++;const disc=task.badge&&!task.up?task.p-task.a:task.cmp?Math.max(task.cmp[0][2],task.cmp[1][2])-task.a:0;saved+=disc;
    $('msg').className='msg ok';$('msg').textContent=(streak>=3?'🔥 Серия '+streak+'! ':'')+pick(['Твоё!','Забрал!','Раньше бота!','Чистая победа!']);sWin();
    const r=$('product').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,streak>=3?60:40);addItem(true);hud();setTimeout(next,900)}
  else{cur.first=false;streak=0;sBad();const s=$('screen');s.classList.remove('bad');void s.offsetWidth;s.classList.add('bad');$('msg').className='msg bad';$('msg').textContent=input+' — не то. Бот уже ближе!';penalty+=1500;input='';drawScreen();hud();if(!hintShown&&!timerOn)showHint()}}
function botWins(){busy=true;cur.won=false;cur.first=false;bot++;streak=0;sLose();$('msg').className='msg bad';$('msg').textContent='Бот успел первым. Правильно: '+task.a+' ₪';addItem(false);hud();setTimeout(next,1800)}
function next(){busy=false;log[lv].push(cur);report();round++;if(round>=LEVELS[lv].n){levelEnd();return}newRound()}
function addItem(win){const s=el('span',win?'':'lost',good[0]);s.title=win?good[1]:'забрал бот';$('items').append(s)}
function hud(){$('meScore').textContent=me;$('botScore').textContent=bot;$('streakP').textContent=streak;$('saved').textContent=saved+' ₪'}
function showHint(){hintShown=true;cur.hint=true;$('hint').hidden=false;$('hintBtn').disabled=true;penalty+=1000}
function modal(title,big,text,btns){const ov=el('div','overlay');const m=el('div','modal');m.append(el('div','big',big),el('h3',null,title),el('p',null,text));const row=el('div','row');row.style.justifyContent='center';btns.forEach(([t,c,f])=>{const b=el('button','btn '+c,t);b.type='button';b.onclick=()=>{ov.remove();f()};row.append(b)});m.append(row);ov.append(m);document.body.append(ov);row.querySelector('button').focus()}
function levelEnd(){cancelAnimationFrame(raf);drawLevels();const l=log[lv],w=l.filter(x=>x.won).length;const win=w>l.length/2;if(win){sFan();for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.2+Math.random()*.6),innerHeight*.3,40),i*150)}
  const last=lv===LEVELS.length-1;
  modal(win?(last?'Чёрная пятница твоя!':'Уровень за тобой!'):'Бот оказался быстрее',win?'🏆':'🤖','Ты забрал '+w+' из '+l.length+'. Сэкономлено всего: '+saved+' ₪.',
   last||!win?[['Ещё раз','main',()=>go(lv,true)]].concat(!last&&!win?[['Дальше всё равно','',()=>go(lv+1)]]:[]):[['Дальше: '+LEVELS[lv+1].name,'main',()=>go(lv+1)],['Ещё раз','',()=>go(lv,true)]])}
function go(n,reset){cancelAnimationFrame(raf);lv=n;round=0;busy=false;if(reset)log[lv]=[];else log[lv]=[];drawLevels();newRound()}
function report(){const box=$('report');box.replaceChildren();const kinds=['Быстрые %','Любой %','Цена со скидкой','Подорожание и сравнение'];const all=log.flat();
  const tb=el('table');const h=el('tr');['Тема','С первой попытки','Подсказка','Среднее время','Вывод'].forEach(x=>h.append(el('th',null,x)));tb.append(h);
  kinds.forEach(k=>{const l=all.filter(x=>x.kind===k);const f=l.filter(x=>x.won&&x.first).length,hi=l.filter(x=>x.hint).length;const ws=l.filter(x=>x.won);const avg=ws.length?Math.round(ws.reduce((s,x)=>s+x.ms,0)/ws.length/1000)+' с':'—';
    let v='—',c='';if(l.length){const r=f/l.length;if(r>=.8){v='уверенно';c='st-ok'}else if(r>=.5){v='почти';c='st-mid'}else{v='тренировать';c='st-bad'}}
    const tr=el('tr');tr.append(el('td',null,k),el('td',null,l.length?f+' из '+l.length:'—'),el('td',null,l.length?String(hi):'—'),el('td',null,avg),el('td',c,v));tb.append(tr)});box.append(tb);
  const miss=all.filter(x=>!x.first).map(x=>x.q+' → '+x.a);if(miss.length)box.append(el('p','how','Ошибки и проигранные раунды: '+miss.join('; ')))}

const pad=$('pad');['7','8','9','4','5','6','1','2','3','del','0','go'].forEach(k=>{const b=el('button','key'+(k==='go'?' go':k==='del'?' del':''),k==='del'?'⌫':k==='go'?'Купить':k);b.type='button';b.dataset.k=k;b.setAttribute('aria-label',k==='del'?'Стереть':k==='go'?'Купить':k);b.onclick=()=>press(k);pad.append(b)});
addEventListener('keydown',e=>{if(document.querySelector('.overlay'))return;let k=null;if(/^[0-9]$/.test(e.key))k=e.key;else if(e.key==='Backspace')k='del';else if(e.key==='Enter')k='go';if(k){e.preventDefault();press(k);const b=pad.querySelector('[data-k="'+k+'"]');if(b){b.classList.add('press');setTimeout(()=>b.classList.remove('press'),90)}}});
$('hintBtn').onclick=showHint;
$('timerBtn').onclick=()=>{timerOn=!timerOn;$('timerBtn').setAttribute('aria-pressed',String(timerOn));$('timerBtn').textContent=timerOn?'⏱ Бот':'⏱ Без бота';$('botBarBox').parentElement.style.opacity=timerOn?1:.35;if(!busy)startTimer()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Включить звук':'Выключить звук')};
addEventListener('resize',size);size();
// первый раунд стартует только после «Погнали», чтобы бот не бежал за заставкой
$('playBtn').onclick=()=>{audio();$('start').remove();drawLevels();newRound()};
$('playBtn').focus();
})();
</script>
</body>
</html>
